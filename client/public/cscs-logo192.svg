<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="96" cy="96" r="96" fill="#f8fafc"/>
  
  <!-- Main blue gradient rounded square (matching login page) -->
  <rect x="24" y="24" width="144" height="144" rx="36" ry="36" fill="url(#blueGradient)" transform="rotate(3 96 96)"/>
  
  <!-- PORR Text (larger for better visibility) -->
  <text x="96" y="120" font-family="Arial, sans-serif" font-size="56" font-weight="bold" text-anchor="middle" fill="white" transform="rotate(3 96 96)">PORR</text>
  
  <!-- Green indicator dot (matching login page) -->
  <circle cx="156" cy="36" r="18" fill="#10b981"/>
  <circle cx="156" cy="36" r="9" fill="white"/>
  
  <!-- Subtitle -->
  <text x="96" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#64748b" font-weight="500">Puntland Offence Records Registry</text>
</svg>
