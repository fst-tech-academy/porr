systemLog:
  destination: file
  path: /usr/local/var/log/mongodb/mongo.log
  logAppend: true
storage:
  dbPath: /usr/local/var/mongodb
net:
  bindIp: 0.0.0.0, ::1
  ipv6: true
security:
  authorization: enabled
  authenticationMechanisms: SCRAM-SHA-1,SCRAM-SHA-256
setParameter:
  authenticationMechanisms: SCRAM-SHA-1,SCRAM-SHA-256
